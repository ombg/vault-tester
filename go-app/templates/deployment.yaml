apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
        - name: go-app
          image: {{ .Values.app.image }}
          env:
            - name: VAULT_ROLE
              value: "go-app-role"
            - name: VAULT_ADDR
              value: "http://vault:8200"