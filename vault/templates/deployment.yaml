apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      initContainers:
      - name: vault-init
        image: {{ .Values.vault.initImage }}
        command: ["sh", "-c", "vault operator init -key-shares=1 -key-threshold=1 -format=json > /vault/data/init-keys.json && vault operator unseal $(jq -r .unseal_keys_b64[0] /vault/data/init-keys.json)"]
        volumeMounts:
        - name: vault-data
          mountPath: /vault/data
      containers:
      - name: vault
        image: {{ .Values.vault.image }}
        ports:
        - containerPort: 8200
        volumeMounts:
        - name: vault-config
          mountPath: /vault/config
        - name: vault-data
          mountPath: /vault/data
        command: ["vault", "server", "-config=/vault/config/config.hcl"]
      volumes:
      - name: vault-config
        configMap:
          name: vault-config
      - name: vault-data
        persistentVolumeClaim:
          claimName: vault-pvc